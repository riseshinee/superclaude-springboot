# sb-security-guard security policy
#
# `/sb-security-guard setup` copies this file to <project>/.claude/security-policy.conf, and the hooks
# prefer the project copy. Edit the project copy to match your company's rules.
# Keep this file owned by the security team and route changes through code review.
#
# Format
#   - One rule per line under a [section]. Blank lines and lines starting with '#' are ignored
#     (trailing comments are not supported).
#   - All matching is case-insensitive.
#   - After changing rules, run `/sb-security-guard verify` to catch syntax errors and false positives.

[secret-patterns]
# Extended regular expressions (ERE, grep -E). A prompt containing a match is not sent.
# For portability use [[:space:]] and [0-9] instead of \s and \d.

# --- Credentials / keys ---
-----BEGIN [A-Z ]*PRIVATE KEY-----
AKIA[0-9A-Z]{16}
gh[pousr]_[A-Za-z0-9]{36}
xox[abprs]-[A-Za-z0-9-]{10,}
sk-[A-Za-z0-9_-]{20,}
AIza[0-9A-Za-z_-]{35}
eyJ[A-Za-z0-9_-]{10,}\.eyJ[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]{10,}
# A real value assigned to password/secret/token etc. ${ENV} placeholders and method calls (getToken()) are excluded.
(password|passwd|pwd|secret|api[_-]?key|access[_-]?key|private[_-]?key|client[_-]?secret|credential|token)[A-Za-z_-]*[\"']?[[:space:]]*[:=][[:space:]\"']*[^$<{([:space:]\"'][^[:space:]\"'(){};,]{7,}([[:space:]\"';,]|$)
# user:password embedded in a URL (jdbc:mysql://user:pass@host)
[a-z][a-z0-9+.-]*://[^/[:space:]:@\"']+:[^/[:space:]@\"']+@

# --- Personal data (PII) ---
# Korean resident / foreigner registration number
(^|[^0-9])[0-9]{2}(0[1-9]|1[0-2])(0[1-9]|[12][0-9]|3[01])-?[1-8][0-9]{6}([^0-9]|$)
# Credit card number
(^|[^0-9])[0-9]{4}[ -][0-9]{4}[ -][0-9]{4}[ -][0-9]{4}([^0-9]|$)
# Korean mobile phone number
(^|[^0-9])01[016789]-[0-9]{3,4}-[0-9]{4}([^0-9]|$)

# --- Internal infrastructure ---
# Private IP ranges (10.x, 172.16-31.x, 192.168.x). localhost/127.0.0.1 do not match.
(^|[^0-9.])(10\.[0-9]{1,3}|172\.(1[6-9]|2[0-9]|3[01])|192\.168)\.[0-9]{1,3}\.[0-9]{1,3}([^0-9]|$)

[sensitive-keywords]
# Fixed strings. A prompt containing one is not sent.
# Add classification labels, internal project code names, and business terms that must not leak.
CONFIDENTIAL
INTERNAL ONLY
TRADE SECRET
# Korean classification labels (confidential / internal only / trade secret)
대외비
사내한정
영업비밀
# Company-specific examples:
# Project Phoenix
# internal price list
# commission rate calculation

[protected-paths]
# gitignore-style globs, relative to the project root. Applied in two places:
#   1) tool-guard hook: blocks tool calls naming these paths (Read, Grep, Bash cat, ...)
#   2) setup generates permissions.deny (Read/Edit) in .claude/settings.json from this list,
#      which also covers @file mentions and Grep/Glob results.
# After changing this list, run `/sb-security-guard setup` again to re-sync the deny rules.

# --- Environment variables / production config ---
**/.env
**/.env.*
**/application-prod*
**/application-real*
**/application-secret*
**/bootstrap-prod*

# --- Keys / certificates / credential files ---
**/*.pem
**/*.key
**/*.jks
**/*.p12
**/*.pfx
**/*.keystore
**/id_rsa*
**/.aws/credentials
**/.ssh/**
**/secrets/**

# --- Internal business logic (company-specific) ---
# Add the core-logic packages Claude must not read, e.g.
# src/main/java/**/pricing/**
# src/main/java/**/settlement/**
# src/main/resources/fraud-rules/**
